<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estante Viva</title>
</head>

<body>
    <div class="cabecalho">
        <nav><h2 style="margin-left: 15px;">Estante Viva</h2>
            <p ><a href="" class="links">Catálogo | Cadastro</a></p>
        </nav>
    </div>

    <main class="meio">
        <h1>Gerenciamento de livros</h1>


        <form>
            <h3 style="margin-left: 15px;">Cadastrar livro</h3>

            <div class="inputs_form">
                <div class="tit_autor">
                    <label for="titulo">Título *</label>
                    <input type="text" required placeholder="Informe o titulo" id="titulo" name="titulo" class="texto">
                </div>

                <div class="tit_autor">
                    <label for="autor">Autor *</label>
                    <input type="text" required placeholder="Informe o autor" id="autor" name="autor" class="autor">
                </div>

                <div class="prec_quant_cadast">
                    <label for="preco">Preço (R$) *</label>
                    <input type="text" required placeholder="0.00" id="preco" name="preco" class="preco">
                </div>

                <div class="prec_quant_cadast">
                    <label for="quant_estoque">Quantidade em estoque *</label>
                    <input type="text" required placeholder="0" id="quant_estoque" name="quant_estoque" class="quant">
                </div>

                 <div class="botao_form"><button type="submit" class="butao_cadastrar">Cadastrar livro</button></div>
            </div>
            
            
        </form>

        <div class="catalogo">
            <section>
                <h3>Catálogo de livros</h3>
                
                <div class="catalogo">
                <input type="text" placeholder="Buscar por parte do título" class="buscar_livro">
               
                
                <div class="lim_buscar">
                    <button class="buscar">Buscar</button>
                    <button class="limpar">Limpar</button>
                </div>

                </div>
            
            </section>
        </div>

        <p>
        <div class="tabela">
            <table>
                <tr>
                    <th>Título</th>
                    <th>Autor</th>
                    <th>preço</th>
                    <th>estoque</th>
                    <th>Ações</th>
                </tr>

                <tr>
                    <td>Título cadastrado</td>
                    <td>Nome do autor</td>
                    <td>R$ 0.00</td>
                    <td>0</td>
                    <td><div class="edit_exc"><button class="editar">Editar</button> <button class="excluir">Excluir</button></div></td>
                </tr>

                <tr>
                    <td>Título cadastrado</td>
                    <td>Nome do autor</td>
                    <td>R$ 0.00</td>
                    <td>0</td>
                    <td><div class="edit_exc"><button class="editar">Editar</button> <button class="excluir">Excluir</button></div></td>
                </tr>
            </table>
        </div>
        </p>
    </main>

    <p>
    <footer>
        Estante Viva - Gerenciamento de catálogo
    </footer>
    </p>

</body>

</html>
